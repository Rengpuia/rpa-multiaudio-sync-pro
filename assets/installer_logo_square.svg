<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sqBgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sqBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e131d"/>
      <stop offset="50%" stop-color="#141a27"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>

    <linearGradient id="waveGradSq" x1="40" y1="160" x2="260" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="plugTopSq" x1="260" y1="60" x2="260" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="plugBotSq" x1="260" y1="160" x2="260" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="btOrangeSq" x1="300" y1="180" x2="380" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="textGradMultiSq" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="sqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="44" fill="url(#sqBg)" stroke="rgba(255,255,255,0.14)" stroke-width="2.5"/>
  <rect width="512" height="512" rx="44" fill="url(#sqBgGlow)"/>

  <!-- Subtle Circular Guides -->
  <circle cx="256" cy="190" r="150" stroke="#10b981" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Logo Mark Centered Top -->
  <g transform="translate(68, 55)" filter="url(#sqGlow)">
    <!-- Dynamic Soundwave -->
    <path d="M15 135 H55 L70 95 L90 175 L115 50 L140 215 L165 25 L188 235 L208 135" 
          stroke="url(#waveGradSq)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top Jack Branch -->
    <path d="M208 135 C222 135, 225 110, 225 85" stroke="url(#plugTopSq)" stroke-width="9" stroke-linecap="round"/>
    <rect x="214" y="55" width="22" height="32" rx="4" fill="url(#plugTopSq)"/>
    <rect x="219" y="38" width="12" height="17" rx="2" fill="#34d399"/>
    <path d="M221 22 L229 22 L232 34 L218 34 Z" fill="#a7f3d0"/>

    <!-- Bottom Jack Branch -->
    <path d="M208 135 C222 135, 225 160, 225 185" stroke="url(#plugBotSq)" stroke-width="9" stroke-linecap="round"/>
    <rect x="214" y="180" width="22" height="32" rx="4" fill="url(#plugBotSq)"/>
    <rect x="219" y="214" width="12" height="17" rx="2" fill="#f97316"/>
    <path d="M218 233 L232 233 L229 245 L221 245 Z" fill="#fed7aa"/>

    <!-- Branching Curves to Badges -->
    <path d="M232 128 H275 C295 128, 305 118, 305 100" stroke="#06b6d4" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M232 142 H275 C295 142, 305 152, 305 170" stroke="#f59e0b" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Top 7.1 Badge -->
    <circle cx="310" cy="80" r="32" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="3"/>
    <text x="310" y="87" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#22d3ee" text-anchor="middle">7.1</text>

    <!-- Bottom BT Badge -->
    <circle cx="310" cy="190" r="32" fill="url(#btOrangeSq)" fill-opacity="0.25" stroke="#f59e0b" stroke-width="3"/>
    <path d="M303 178 L318 193 L311 200 V174 L318 181 L303 196" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography Bottom Section -->
  <g transform="translate(256, 350)" text-anchor="middle">
    <!-- Mini Badge -->
    <rect x="-85" y="-14" width="170" height="22" rx="11" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="0" y="2" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a7f3d0" letter-spacing="1">RPA AUDIO LABS</text>

    <!-- App Main Title -->
    <text y="42" font-family="'Inter', sans-serif" font-weight="900" font-style="italic" font-size="29" letter-spacing="-0.5">
      <tspan fill="url(#textGradMultiSq)">RPA MULTI</tspan>
      <tspan fill="#ffffff">AUDIO</tspan>
    </text>
    <text y="75" font-family="'Inter', sans-serif" font-weight="900" font-style="italic" font-size="28" letter-spacing="0">
      <tspan fill="#ffffff">SYNC </tspan>
      <tspan fill="#f59e0b">PRO</tspan>
    </text>

    <!-- Subtitle -->
    <text y="100" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      7.1 USB Surround + Bluetooth Dual Router
    </text>

    <!-- Developer Credit -->
    <line x1="-160" y1="116" x2="160" y2="116" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text y="132" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">
      Developer: <tspan fill="#34d399" font-weight="700">K Vanlalrengpuia</tspan>
    </text>
  </g>
</svg>
